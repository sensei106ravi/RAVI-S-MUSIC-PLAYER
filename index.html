<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravi's Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Ravi's Music Player</span>
      <span class="brand-sub">local collection</span>
    </div>
  </header>

  <main class="library" id="library">
    <!-- category cards are generated by script.js from the SONG_LIBRARY list -->
  </main>

  <footer class="player-bar">
    <div class="now-playing">
      <div class="eq" id="eq"><span></span><span></span><span></span></div>
      <div class="now-playing-text">
        <span class="np-title" id="npTitle">Nothing playing yet</span>
        <span class="np-category" id="npCategory">pick a song from a card above</span>
      </div>
    </div>

    <div class="transport">
      <button class="ctrl-btn" id="prevBtn" title="Previous">⏮</button>
      <button class="ctrl-btn ctrl-btn--main" id="playBtn" title="Play / Pause">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="Next">⏭</button>
    </div>

    <div class="seek">
      <span class="time" id="timeCurrent">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time" id="timeTotal">0:00</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
